name: release

# Every push to main whose Cargo.toml version has no release yet builds the installers (Linux .deb,
# Windows setup .exe, macOS .dmg) and publishes them as release v<version>; installed copies then
# update themselves to it. To ship: bump `version` in Cargo.toml and push.
# "Run workflow" on the Actions tab builds the same files without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 = oldest glibc we support, so the .deb runs on 22.04 and newer.
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable

      - name: Linux (tests, .deb)
        if: runner.os == 'Linux'
        run: |
          # skip the real-broadcast test: CI runners have no LAN
          cargo test --release -- --skip two_pets_find_each_other
          tools/build-deb.sh

      - name: Windows (installer)
        if: runner.os == 'Windows'
        shell: bash
        run: tools/build-windows.sh

      - name: macOS (universal .app in a .dmg)
        if: runner.os == 'macOS'
        run: tools/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lanpet-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # the asset names are what the in-app updater downloads (src/update.rs ASSET)
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LanPet $TAG" --generate-notes
