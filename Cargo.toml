[package]
name = "lanpet"
# Bumping this and pushing to main publishes release v<version> (.github/workflows/release.yml),
# which installed copies then update to.
version = "0.4.1"
edition = "2024"

[dependencies]
# No "wayland" feature on purpose: on Linux we run through X11/XWayland, which is what
# lets a small always-on-top window position itself above the taskbar.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# Update checks and downloads from GitHub Releases; rustls so no OS TLS library is needed.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
